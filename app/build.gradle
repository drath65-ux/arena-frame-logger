plugins {
    id 'com.android.application'
}

android {
    namespace 'com.drath.arenaframelogger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.drath.arenaframelogger'
        minSdk 29
        targetSdk 34
        versionCode 12
        versionName "0.5"
    }

    signingConfigs {
        // Fixed debug key committed to the repo, so every build can install
        // over the previous one without uninstalling first.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device text recognition (bundled Latin model, works offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
