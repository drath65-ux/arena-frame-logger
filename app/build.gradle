plugins {
    id 'com.android.application'
}

android {
    namespace 'com.drath.arenaframelogger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.drath.arenaframelogger'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    signingConfigs {
        // Fixed debug key committed to the repo, so every build can install
        // over the previous one without uninstalling first.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
