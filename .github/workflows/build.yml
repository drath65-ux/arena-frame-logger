name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: set -o pipefail; gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # If the build fails, post the end of the log as a commit comment so it can be read via the API.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error:|What went wrong|e: |FAILURE" -A6 build.log | head -80; echo '---'; tail -40 build.log; echo '```'; } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk arena-frame-logger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arena-frame-logger-apk
          path: arena-frame-logger.apk

      # Publish to a rolling "latest" release so the APK has a direct download link.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Build from ${{ github.sha }}. Download arena-frame-logger.apk below."
          prerelease: false
          make_latest: true
          files: arena-frame-logger.apk
